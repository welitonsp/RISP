name: Verificação

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --include=optional --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build (verificação)
        run: npm run build:pages
